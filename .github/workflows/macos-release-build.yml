name: Build macOS Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'SmeltKit/SECL' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Flutter 3.19.6
        run: |
          git clone --depth 1 --branch 3.19.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          if ! arch -x86_64 /usr/bin/true; then
            softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Build SECL
        env:
          SECL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python3 tools/build.py --embed-curseforge-key

      - name: Package macOS app
        run: |
          app=app/build/macos/Build/Products/Release/SECL.app
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" SECL-macos-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: SECL-macos-arm64
          path: SECL-macos-arm64.zip
          if-no-files-found: error
